<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawnwell — keep the moonwell lit until dawn</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101736; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="600" aria-label="Dawnwell: move the lantern basket to catch moon drops, grab suns for a shield, and dodge thorn shards for five waves until dawn"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
